<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1bff">
<title>Orbit</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --blue:#2b1bff; --ink:#12103a; --paper:#fff; --lilac:#ecE9ff; --pink:#ff4f9a; --lime:#c6ff3d; --sun:#ffd43b;
  --mute:#5b5890; --soft:#cfcaff;
  --bw:2.5px; --sh:4px 4px 0 var(--ink);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
  --display:'Bagel Fat One','Bricolage Grotesque',system-ui,sans-serif;
  --body:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--blue);background-image:radial-gradient(rgba(255,255,255,.14) 1.6px,transparent 1.7px);background-size:24px 24px;color:#fff;font-family:var(--body);font-size:16px;line-height:1.4;color-scheme:light}
button{font:inherit;cursor:pointer;color:inherit}
h1,h2,h3{margin:0;font-weight:400}

/* ---------- ambient shapes ---------- */
.shapes{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.shapes i{position:absolute;display:block;opacity:.55;animation:floaty var(--t,16s) ease-in-out infinite alternate}
.s1{width:130px;height:130px;border-radius:50%;background:var(--sun);left:-40px;top:12vh;--t:18s}
.s2{width:110px;height:110px;background:var(--pink);right:-26px;top:28vh;clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);--t:14s}
.s3{width:150px;height:150px;border-radius:50%;border:16px solid var(--lime);left:60%;bottom:-40px;--t:20s}
.s4{width:90px;height:90px;background:var(--pink);left:8%;bottom:16vh;clip-path:polygon(50% 0,100% 100%,0 100%);--t:15s}
.s5{width:80px;height:80px;right:10%;top:4vh;background:var(--lime);clip-path:polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%);--t:17s}
@keyframes floaty{from{transform:translate(0,0) rotate(0deg)}to{transform:translate(26px,-34px) rotate(40deg)}}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:3000;background:var(--blue);background-image:radial-gradient(rgba(255,255,255,.14) 1.6px,transparent 1.7px);background-size:24px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .5s,visibility 0s .5s}
#splash.gone{opacity:0;visibility:hidden}
.ball{width:50px;height:50px;border-radius:50%;background:var(--lime);border:var(--bw) solid var(--ink);animation:bounce .6s var(--ease) infinite alternate}
.ground{width:50px;height:10px;border-radius:50%;background:rgba(18,16,58,.45);animation:squash .6s var(--ease) infinite alternate}
@keyframes bounce{from{transform:translateY(0) scaleY(.88)}to{transform:translateY(-60px) scaleY(1.06)}}
@keyframes squash{from{transform:scale(1.2);opacity:.6}to{transform:scale(.6);opacity:.25}}

/* ---------- shared ---------- */
.stk{background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:var(--sh)}
.mut{color:var(--mute);font-size:13px}
.err{color:#d6004f;font-weight:700;font-size:14px;min-height:20px;margin:8px 0 0}
.empty{margin:18px 14px;padding:22px 16px;text-align:center;color:var(--soft);border:2.5px dashed rgba(255,255,255,.45);border-radius:20px;font-weight:500;grid-column:1/-1}
input,textarea{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--lilac);border:var(--bw) solid var(--ink);border-radius:14px;padding:13px 14px;margin-bottom:10px;outline:0;transition:box-shadow .2s var(--spring),transform .2s var(--spring)}
input::placeholder,textarea::placeholder{color:#7d79b3}
input:focus,textarea:focus{box-shadow:4px 4px 0 var(--pink);transform:translate(-2px,-2px)}
textarea{resize:vertical;min-height:76px}
input[type=datetime-local]{color-scheme:light}

.btn{display:inline-block;text-align:center;font:400 17px var(--display);letter-spacing:.01em;color:var(--ink);background:var(--lime);border:var(--bw) solid var(--ink);border-radius:14px;padding:13px 18px;width:100%;box-shadow:var(--sh);transition:transform .18s var(--spring),box-shadow .18s var(--spring);user-select:none}
@media (hover:hover){.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.6;pointer-events:none}
.btn.small{width:auto;font-size:15px;padding:9px 14px;border-radius:12px}
.btn.ghost{background:var(--paper)}
.btn.danger{background:var(--pink)}

/* ---------- auth + gate ---------- */
.screen{position:relative;z-index:2;min-height:100dvh;max-width:460px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;padding:28px 18px;animation:enter .55s var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.hero{position:relative;text-align:center;margin-bottom:26px}
.wm{font-family:var(--display);font-size:clamp(70px,24vw,104px);line-height:1;letter-spacing:.02em;display:flex;justify-content:center;margin-bottom:6px}
.wm span{display:inline-block;color:var(--lime);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);cursor:pointer;animation:letterIn .9s var(--spring) backwards,idle 4.6s ease-in-out infinite alternate;animation-delay:calc(var(--n)*90ms),calc(1.2s + var(--n)*180ms)}
.wm span:nth-child(2){color:var(--pink)}
.wm span:nth-child(3){color:var(--sun)}
.wm span:nth-child(4){color:#fff}
@keyframes letterIn{from{transform:translateY(-160px) rotate(-35deg);opacity:0}to{transform:none;opacity:1}}
@keyframes idle{from{transform:translateY(0) rotate(0deg)}to{transform:translateY(-7px) rotate(2.5deg)}}
.tag{margin:0;font-size:18px;font-weight:500;color:#fff}
.badge{position:absolute;right:-4px;top:-38px;width:88px;height:88px;animation:spin 16s linear infinite;filter:drop-shadow(3px 3px 0 var(--ink))}
.hero.small .badge{display:none}
.hero.small .wm{font-size:64px}
@keyframes spin{to{transform:rotate(360deg)}}
.card{padding:20px}
.card h2{font:400 26px var(--display);margin-bottom:6px}
.card p{margin:0 0 14px;color:var(--mute)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--lilac);border:var(--bw) solid var(--ink);border-radius:16px;padding:4px;margin-bottom:16px}
.sgi{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--sun);border:2px solid var(--ink);border-radius:11px;transform:translateX(calc(var(--i,0)*100%));transition:transform .45s var(--spring)}
.seg button{position:relative;border:0;background:none;padding:10px;font:400 16px var(--display);color:var(--ink)}
.anim{animation:rise .45s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- app shell ---------- */
#app{position:relative;z-index:2;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;animation:enter .55s var(--spring) both}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 8px}
.brand{display:flex;align-items:center;gap:8px;font:400 32px var(--display);color:var(--lime);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);line-height:1}
.logo{width:34px;height:34px;animation:wobble 5s ease-in-out infinite;filter:drop-shadow(2px 2px 0 var(--ink))}
@keyframes wobble{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg) scale(1.08)}}
.chip{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:999px;box-shadow:3px 3px 0 var(--ink);font-weight:700;font-size:14px;max-width:46vw}
.chip span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{flex:none;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);font:400 15px var(--display);background-image:linear-gradient(135deg,rgba(255,255,255,.4),transparent 60%)}
.chip .av{transition:transform .3s var(--spring)}
.chip:hover .av{transform:rotate(-14deg) scale(1.12)}
main{flex:1;min-height:0;position:relative}
.tab{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;animation:tabIn .42s var(--ease) both}
@keyframes tabIn{from{opacity:0;transform:translateX(var(--dx,24px))}to{opacity:1;transform:none}}
.scroll{flex:1;overflow-y:auto;padding:12px 14px 18px;-webkit-overflow-scrolling:touch}
.bar{display:flex;gap:10px;align-items:center;padding:8px 14px}
.bar input{margin:0;flex:1}

nav{position:relative;display:flex;margin:6px 14px calc(12px + env(safe-area-inset-bottom));padding:6px;background:var(--paper);border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:var(--sh)}
.ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);background:var(--lime);border:2px solid var(--ink);border-radius:17px;transform:translateX(calc(var(--i,0)*100%));transition:transform .5s var(--spring)}
nav button{position:relative;flex:1;border:0;background:none;color:var(--ink);padding:8px 0 6px;font:700 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:2px;opacity:.6;transition:opacity .2s}
nav button.on{opacity:1}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
nav button.on svg{animation:iconHop .55s var(--spring)}
@keyframes iconHop{0%{transform:scale(.7) rotate(-14deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}

/* ---------- chat ---------- */
#msgs{flex:1;overflow-y:auto;padding:10px 14px 14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:80%;align-self:flex-start;background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:18px 18px 18px 4px;padding:8px 12px 6px;box-shadow:3px 3px 0 var(--ink);word-break:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--lime);border-radius:18px 18px 4px 18px}
.m.pop{animation:pop .5s var(--spring) both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(18px) rotate(var(--r,-3deg))}to{opacity:1;transform:none}}
.m.me.pop{--r:3deg}
.m .who{display:flex;align-items:center;gap:6px;font:800 12px var(--body);margin-bottom:2px}
.m .who i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}
.m .t{font-size:11px;color:var(--mute);margin-top:3px;text-align:right;white-space:normal}
.m .x{border:0;background:none;color:var(--mute);font-size:11px;margin-left:10px;padding:0;text-decoration:underline}
#msgForm{display:flex;gap:10px;align-items:flex-start;padding:6px 14px 6px}
#msgForm input{margin:0;flex:1}
#msgForm .btn{margin-top:0}

/* ---------- photos ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:6px 2px}
.ph{margin:0;background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:12px;padding:6px 6px 8px;box-shadow:var(--sh);transform:rotate(var(--rot,0deg));transition:transform .3s var(--spring);cursor:pointer}
.ph:nth-child(odd){--rot:-1.6deg}
.ph:nth-child(even){--rot:1.4deg}
.ph:hover,.ph:active{transform:rotate(0deg) scale(1.04)}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;background:var(--lilac)}
.ph figcaption{font-size:12px;font-weight:700;padding:6px 2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stag .ph{animation:drop .65s var(--spring) backwards;animation-delay:var(--d,0ms)}
@keyframes drop{from{opacity:0;transform:translateY(-50px) rotate(-10deg) scale(.7)}to{opacity:1;transform:rotate(var(--rot,0deg))}}
#lightbox{position:fixed;inset:0;background:rgba(18,16,58,.88);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px;color:#fff;animation:fade .25s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
#lightbox img{max-width:100%;max-height:66dvh;border:var(--bw) solid var(--ink);border-radius:14px;background:#fff;padding:6px;box-shadow:6px 6px 0 var(--pink);animation:zoom .45s var(--spring) both}
@keyframes zoom{from{opacity:0;transform:scale(.6) rotate(-6deg)}to{opacity:1;transform:rotate(-1deg)}}
#lbInfo{text-align:center;font-weight:500}
#lightbox .row{display:flex;gap:12px}

/* ---------- map ---------- */
#map{flex:1;min-height:200px;margin:2px 14px 0;border:var(--bw) solid var(--ink);border-radius:20px;box-shadow:var(--sh);overflow:hidden;z-index:0}
.people{display:flex;gap:10px;overflow-x:auto;padding:14px 14px 10px}
.person{flex:none;display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:16px;padding:6px 14px 6px 6px;box-shadow:3px 3px 0 var(--ink);transition:transform .2s var(--spring)}
.person:active{transform:translate(3px,3px);box-shadow:none}
.person.off{opacity:.6;box-shadow:none;border-style:dashed}
.person .pn{display:flex;flex-direction:column;line-height:1.2}
.person small{color:var(--mute);font-size:12px}
.stag .person{animation:rise .5s var(--spring) backwards;animation-delay:var(--d,0ms)}
.pin{position:relative;width:38px;height:38px;border-radius:50%;border:var(--bw) solid var(--ink);display:flex;align-items:center;justify-content:center;font:400 17px var(--display);box-shadow:3px 3px 0 var(--ink);background-image:linear-gradient(135deg,rgba(255,255,255,.4),transparent 60%)}
.pin::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--pc,#fff);animation:ping 2s ease-out infinite}
@keyframes ping{from{transform:scale(.9);opacity:.9}to{transform:scale(2.1);opacity:0}}
.leaflet-container{font-family:var(--body);background:var(--lilac)}
.leaflet-popup-content-wrapper{border:2px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);color:var(--ink);font-weight:700}
.leaflet-popup-tip{border:2px solid var(--ink);box-shadow:none}

/* ---------- switch ---------- */
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;cursor:pointer;font-weight:700}
.switch input{display:none}
.tg{flex:none;position:relative;width:56px;height:32px;border:var(--bw) solid var(--ink);border-radius:20px;background:var(--lilac);transition:background .25s}
.tg::after{content:"";position:absolute;top:2.5px;left:2.5px;width:21px;height:21px;border-radius:50%;background:var(--ink);transition:transform .4s var(--spring)}
.switch input:checked+.tg{background:var(--lime)}
.switch input:checked+.tg::after{transform:translateX(24px)}
.bar .switch{flex:1;background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:8px 12px}

/* ---------- plans ---------- */
.plan{margin-bottom:18px;overflow:hidden}
.stag .plan{animation:drop2 .65s var(--spring) backwards;animation-delay:var(--d,0ms)}
@keyframes drop2{from{opacity:0;transform:translateY(40px) rotate(2deg)}to{opacity:1;transform:none}}
.phead{background:var(--c,var(--sun));border-bottom:var(--bw) solid var(--ink);padding:12px 14px}
.phead h3{font:400 22px var(--display);line-height:1.15}
.pmeta{font-size:13px;font-weight:500;margin-top:2px}
.pbody{padding:12px 14px 14px}
.pdet{margin:0 0 8px;white-space:pre-wrap}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:2px dashed #cfcaff}
.opt b{display:block}
.vote,.rs{font:700 13px var(--body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:7px 13px;box-shadow:2px 2px 0 var(--ink);transition:transform .18s var(--spring),box-shadow .18s}
.vote:active,.rs:active{transform:translate(2px,2px);box-shadow:none}
.vote.on{background:var(--ink);color:var(--lime)}
.rsrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.rs.on[data-st=going]{background:var(--lime)}
.rs.on[data-st=maybe]{background:var(--sun)}
.rs.on[data-st=no]{background:var(--pink)}
.plan .del{border:0;background:none;color:#d6004f;font-weight:700;font-size:13px;text-decoration:underline;padding:0;margin-top:12px}
#planForm{padding:16px;margin-top:14px}
#dateInputs input{margin-bottom:8px}

/* ---------- me ---------- */
.box{padding:16px;margin-bottom:16px}
.box .lab{font-size:13px;font-weight:700;color:var(--mute);margin-bottom:4px}
.sws{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0 2px}
.swc{width:40px;height:40px;border-radius:50%;border:var(--bw) solid var(--ink);transition:transform .3s var(--spring),box-shadow .3s}
.swc:active{transform:scale(.85)}
.swc.on{transform:scale(1.18);box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--ink)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,40px) scale(.9);background:var(--sun);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:14px;box-shadow:var(--sh);padding:10px 16px;font-weight:700;font-size:14px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s,transform .45s var(--spring);max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="shapes" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i></div>
<div id="splash" aria-hidden="true"><div class="ball"></div><div class="ground"></div></div>
<div id="toast" role="status"></div>

<section id="auth" class="screen" hidden>
  <div class="hero">
    <svg class="badge" viewBox="0 0 120 120" aria-hidden="true">
      <defs><path id="cp" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>
      <circle cx="60" cy="60" r="56" fill="#ffd43b" stroke="#12103a" stroke-width="3"/>
      <text font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="13" fill="#12103a"><textPath href="#cp" textLength="268" lengthAdjust="spacing">friends only • invite only • </textPath></text>
      <circle cx="60" cy="60" r="21" fill="#ff4f9a" stroke="#12103a" stroke-width="3"/>
      <path d="M52 57h.01M68 57h.01" stroke="#12103a" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M52 66q8 8 16 0" fill="none" stroke="#12103a" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <h1 class="wm" id="wm" aria-label="orbit"><span style="--n:0">o</span><span style="--n:1">r</span><span style="--n:2">b</span><span style="--n:3">i</span><span style="--n:4">t</span></h1>
    <p class="tag">A private hangout for your friends.</p>
  </div>
  <div class="card stk">
    <div class="seg" id="seg">
      <i class="sgi"></i>
      <button id="tabLogin" type="button">Sign in</button>
      <button id="tabSignup" type="button">Join</button>
    </div>
    <form id="loginForm" class="anim">
      <input id="liEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="liPass" type="password" placeholder="Password" autocomplete="current-password" required>
      <button id="liBtn" class="btn" type="submit">Sign in</button>
      <p class="err" id="loginErr"></p>
    </form>
    <form id="signupForm" class="anim" hidden>
      <input id="suName" type="text" placeholder="Your name" maxlength="30" autocomplete="nickname" required>
      <input id="suEmail" type="email" placeholder="Email" autocomplete="email" required>
      <input id="suPass" type="password" placeholder="Password (6+ characters)" minlength="6" autocomplete="new-password" required>
      <input id="suCode" type="text" placeholder="Invite code" autocomplete="off" required>
      <button id="suBtn" class="btn" type="submit">Create account</button>
      <p class="err" id="signupErr"></p>
    </form>
  </div>
</section>

<section id="gate" class="screen" hidden>
  <div class="hero small"><h1 class="wm" aria-label="orbit"><span style="--n:0">o</span><span style="--n:1">r</span><span style="--n:2">b</span><span style="--n:3">i</span><span style="--n:4">t</span></h1></div>
  <div class="card stk">
    <h2>One more step</h2>
    <p>Hi <b id="gateName"></b>. Enter the invite code your friends gave you.</p>
    <form id="gateForm">
      <input id="gateCode" type="text" placeholder="Invite code" autocomplete="off" required>
      <button id="gateBtn" class="btn" type="submit">Unlock</button>
      <p class="err" id="gateErr"></p>
    </form>

function ago(iso){
  if(!iso) return '';

  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60) + ' min ago';
  if(s < 86400) return Math.floor(s/3600) + ' h ago';
  return Math.floor(s/86400) + ' d ago';
}

function authErr(e){

  if(/rate limit/i.test(m)) return 'Too many tries. Wait a minute and try again.';
  if(/valid email|invalid.*email/i.test(m)) return "That email doesn't look right.";

}

  if(error){ toast("Couldn't load messages."); return; }

function renderMsgs(){
  const box = $('#msgs'); box.innerHTML = '';

function msgEl(m, fresh){
  const mine = m.user_id === me.id;
  const d = document.createElement('div'); d.className = 'm' + (mine ? ' me' : '') + (fresh ? ' pop' : ''); d.dataset.id = m.id;

// ---------- photos ----------
function resize(file, max = 1280, q = 0.82){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height; const r = Math.min(1, max / Math.max(w, h));
      w = Math.round(w * r); h = Math.round(h * r);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not shrink the photo')), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Could not read the photo')); };
    img.src = url;
  });
}
async function loadPhotos(){
  const { data, error } = await sb.from('photos').select('id,user_id,path,caption,created_at').order('created_at', { ascending: false }).limit(90);
  if(error){ toast("Couldn't load photos."); return; }
  photos = data || []; photoUrls = {};
  if(photos.length){
    const r = await sb.storage.from('photos').createSignedUrls(photos.map(p => p.path), 3600);
    (r.data || []).forEach(x => { if(x.signedUrl) photoUrls[x.path] = x.signedUrl; });
  }
  photosAt = Date.now(); renderPhotos();
}
function renderPhotos(){
  const g = $('#photoGrid');
  if(!photos.length){ g.innerHTML = '<p class="empty">No photos yet. Tap Add photos to post the first one.</p>'; return; }
  g.innerHTML = photos.map((p, i) => photoUrls[p.path]
    ? `<figure class="ph" data-i="${i}" style="--d:${Math.min(i, 14) * 60}ms"><img loading="lazy" src="${esc(photoUrls[p.path])}" alt="${esc(p.caption || 'Photo from ' + nameOf(p.user_id))}"><figcaption>${esc(p.caption || nameOf(p.user_id))}</figcaption></figure>`
    : '').join('');
}
$('#photoGrid').onclick = e => { const f = e.target.closest('.ph'); if(f) openPhoto(+f.dataset.i); };
function openPhoto(i){
  const p = photos[i]; if(!p) return; openPhotoIdx = i;

  $('#lbInfo').textContent = nameOf(p.user_id) + ' · ' + fmtTime(p.created_at) + (p.caption ? ' · ' + p.caption : '');
  $('#lbDel').hidden = p.user_id !== me.id;

}
function closePhoto(){ $('#lightbox').hidden = true; $('#lbImg').removeAttribute('src'); openPhotoIdx = -1; }
$('#lbClose').onclick = closePhoto;

$('#lbDel').onclick = async () => {

};
$('#photoInput').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; if(!files.length) return;
  const cap = $('#photoCap').value.trim(); let ok = 0;
  for(let i = 0; i < files.length; i++){
    $('#upStatus').textContent = `Uploading ${i + 1} of ${files.length}...`;
    try {
      const blob = await resize(files[i]);
      const path = `${me.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
      if(up.error) throw up.error;
      const ins = await sb.from('photos').insert({ user_id: me.id, path, caption: cap || null });
      if(ins.error){ await sb.storage.from('photos').remove([path]); throw ins.error; }
      ok++;
    } catch(err){ toast("Couldn't upload a photo: " + (err.message || 'unknown error')); }
  }
  $('#photoCap').value = ''; $('#upStatus').textContent = '';
  if(ok){ await loadPhotos(); toast(ok === 1 ? 'Photo added' : ok + ' photos added'); }
};

function initMap(){
  if(map) return;
  map = L.map('map', { zoomControl: false }).setView([22.5, 80], 4);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
}
function renderMarkers(){
  if(!map) return;
  const live = Object.values(profiles).filter(p => p.share_location && p.lat != null && p.lng != null);
  const ids = new Set(live.map(p => p.id));
  Object.keys(markers).forEach(id => { if(!ids.has(id)){ map.removeLayer(markers[id]); delete markers[id]; } });
  live.forEach(p => {
    const ll = [p.lat, p.lng]; const c = col(p.color);
    const icon = L.divIcon({
      className: '',
      html: `<div class="pin" style="background-color:${c};color:${fg(c)};--pc:${c}">${esc(ini(p.name))}</div>`,
      iconSize: [38, 38], iconAnchor: [19, 19], popupAnchor: [0, -20]
    });
    const popup = `${esc(p.name)}<br><span style="font-weight:500">${esc(ago(p.location_updated_at))}</span>`;
    if(markers[p.id]){ markers[p.id].setLatLng(ll).setIcon(icon).setPopupContent(popup); }
    else { markers[p.id] = L.marker(ll, { icon }).addTo(map).bindPopup(popup); }
  });
  if(firstFit && live.length){
    map.fitBounds(L.latLngBounds(live.map(p => [p.lat, p.lng])), { padding: [50, 50], maxZoom: 15 });
    firstFit = false;
  }
}
function renderPeople(){
  const list = Object.values(profiles).sort((a, b) => (b.share_location ? 1 : 0) - (a.share_location ? 1 : 0) || a.name.localeCompare(b.name));
  $('#people').innerHTML = list.map((p, i) => {
    const live = p.share_location && p.lat != null;
    return `<button type="button" class="person${live ? '' : ' off'}" style="--d:${Math.min(i, 12) * 55}ms" ${live ? `data-id="${esc(p.id)}"` : 'disabled'}>
      ${avHtml(p)}<span class="pn"><b>${esc(p.name)}${p.id === me?.id ? ' (you)' : ''}</b><small>${live ? esc(ago(p.location_updated_at)) : 'Location off'}</small></span></button>`;
  }).join('') || '<p class="empty" style="margin:0">No one is here yet.</p>';
}
$('#people').onclick = e => {
  const b = e.target.closest('.person[data-id]'); if(!b || !map) return;
  const p = profiles[b.dataset.id]; if(!p || p.lat == null) return;
  map.flyTo([p.lat, p.lng], 15, { duration: 1.2 }); markers[p.id]?.openPopup();
};
function syncShare(){ const on = !!profiles[me?.id]?.share_location; $('#shareMap').checked = on; $('#shareMe').checked = on; }
async function pushLoc(pos){
  lastSent = Date.now();
  const row = { lat: pos.coords.latitude, lng: pos.coords.longitude, location_updated_at: new Date().toISOString() };
  const { error } = await sb.from('profiles').update(row).eq('id', me.id);
  if(!error && profiles[me.id]) Object.assign(profiles[me.id], row);
}
function startWatch(){
  if(watchId != null || !navigator.geolocation) return;
  watchId = navigator.geolocation.watchPosition(pos => {
    if(watchId == null || Date.now() - lastSent < 25000) return;
    pushLoc(pos).then(() => { if(currentTab === 'map') renderMarkers(); });
  }, err => {
    if(err.code === 1){ toast('Location permission was turned off.'); setSharing(false).then(syncShare); }
  }, { enableHighAccuracy: true, maximumAge: 20000, timeout: 30000 });
}
function stopWatch(){ if(watchId != null){ navigator.geolocation.clearWatch(watchId); watchId = null; } }
async function setSharing(on){
  if(on){
    if(!navigator.geolocation){ toast("This browser can't share location."); return false; }
    const got = await new Promise(res => navigator.geolocation.getCurrentPosition(
      async pos => { await pushLoc(pos); res(true); },
      err => { toast(err.code === 1 ? 'Allow location access to share it.' : "Couldn't get your location."); res(false); },
      { enableHighAccuracy: true, timeout: 15000 }));
    if(!got) return false;
    const { error } = await sb.from('profiles').update({ share_location: true }).eq('id', me.id);
    if(error){ toast("Couldn't save that."); return false; }
    profiles[me.id].share_location = true; startWatch(); renderPeople(); renderMarkers(); return true;
  }
  stopWatch();
  const off = { share_location: false, lat: null, lng: null, location_updated_at: null };
  const { error } = await sb.from('profiles').update(off).eq('id', me.id);
  if(error){ toast("Couldn't save that."); return false; }
  Object.assign(profiles[me.id], off); renderPeople(); renderMarkers(); return true;
}
['#shareMap', '#shareMe'].forEach(sel => {
  $(sel).onchange = async e => { const on = e.target.checked; const ok = await setSharing(on); if(!ok) e.target.checked = !on; syncShare(); };
});

// ---------- plans ----------
async function loadPlans(){
  const [a, b, c, d] = await Promise.all([
    sb.from('plans').select('*').order('created_at', { ascending: false }).limit(50),
    sb.from('plan_options').select('*').order('option_time'),
    sb.from('plan_votes').select('*'),
    sb.from('plan_rsvps').select('*')
  ]);
  if(a.error){ toast("Couldn't load plans."); return; }
  plans = a.data || []; opts = b.data || []; votes = c.data || []; rsvps = d.data || [];
  renderPlans();
}
function schedulePlans(){ clearTimeout(planTimer); planTimer = setTimeout(loadPlans, 400); }
function renderPlans(){
  const box = $('#planList');
  if(!plans.length){ box.innerHTML = '<p class="empty" style="margin:0">No plans yet. Tap New plan to start one.</p>'; return; }
  const labels = { going: 'Going', maybe: 'Maybe', no: "Can't go" };
  box.innerHTML = plans.map((p, idx) => {
    const o = opts.filter(x => x.plan_id === p.id);
    const r = rsvps.filter(x => x.plan_id === p.id);
    const mine = r.find(x => x.user_id === me.id)?.status;
    const optHtml = o.map(x => {
      const ov = votes.filter(v => v.option_id === x.id);
      const iv = ov.some(v => v.user_id === me.id);
      return `<div class="opt"><div><b>${esc(fmtPlan(x.option_time))}</b>
        <span class="mut">${ov.length ? esc(ov.map(v => nameOf(v.user_id)).join(', ')) : 'No votes yet'}</span></div>
        <button class="vote ${iv ? 'on' : ''}" data-act="vote" data-opt="${esc(x.id)}">${ov.length} ${ov.length === 1 ? 'vote' : 'votes'}</button></div>`;
    }).join('');
    const rsBtns = ['going', 'maybe', 'no'].map(st =>
      `<button class="rs ${mine === st ? 'on' : ''}" data-act="rsvp" data-plan="${esc(p.id)}" data-st="${st}">${labels[st]} (${r.filter(x => x.status === st).length})</button>`).join('');
    const sum = ['going', 'maybe', 'no'].map(st => {
      const n = r.filter(x => x.status === st).map(x => nameOf(x.user_id));
      return n.length ? `${labels[st]}: ${esc(n.join(', '))}` : '';
    }).filter(Boolean).join(' · ');
    return `<article class="plan stk" style="--c:${HEADS[idx % HEADS.length]};--d:${Math.min(idx, 8) * 80}ms">
      <div class="phead"><h3>${esc(p.title)}</h3><div class="pmeta">${p.place ? esc(p.place) + ' · ' : ''}by ${esc(nameOf(p.created_by))}</div></div>
      <div class="pbody">
        ${p.details ? `<p class="pdet">${esc(p.details)}</p>` : ''}
        ${optHtml}
        <div class="rsrow">${rsBtns}</div>
        ${sum ? `<div class="mut" style="margin-top:8px">${sum}</div>` : ''}
        ${p.created_by === me.id ? `<button class="del" data-act="delplan" data-plan="${esc(p.id)}">Delete plan</button>` : ''}
      </div></article>`;
  }).join('');
}
$('#planList').onclick = async e => {
  const b = e.target.closest('button[data-act]'); if(!b) return;
  const act = b.dataset.act; let err = null;
  if(act === 'vote'){
    const opt = b.dataset.opt; const has = votes.some(v => v.option_id === opt && v.user_id === me.id);
    const res = has ? await sb.from('plan_votes').delete().eq('option_id', opt).eq('user_id', me.id)
                    : await sb.from('plan_votes').insert({ option_id: opt, user_id: me.id });
    err = res.error;
  } else if(act === 'rsvp'){
    const plan = b.dataset.plan, st = b.dataset.st;
    const cur = rsvps.find(x => x.plan_id === plan && x.user_id === me.id)?.status;
    const res = cur === st ? await sb.from('plan_rsvps').delete().eq('plan_id', plan).eq('user_id', me.id)
                           : await sb.from('plan_rsvps').upsert({ plan_id: plan, user_id: me.id, status: st }, { onConflict: 'plan_id,user_id' });
    err = res.error;
  } else if(act === 'delplan'){
    if(!confirm('Delete this plan?')) return;
    err = (await sb.from('plans').delete().eq('id', b.dataset.plan)).error;
    if(!err) toast('Plan deleted');
  }
  if(err) toast("That didn't work. Try again.");
  loadPlans();
};
$('#newPlanBtn').onclick = () => { $('#planForm').hidden = !$('#planForm').hidden; };
$('#plCancel').onclick = () => { $('#planForm').hidden = true; };
$('#addDate').onclick = () => {
  if($$('#dateInputs input').length >= 6){ toast('You can add up to 6 times.'); return; }
  const i = document.createElement('input'); i.type = 'datetime-local'; $('#dateInputs').appendChild(i);
};
$('#planForm').onsubmit = e => {
  e.preventDefault();
  busy($('#plSave'), async () => {
    const title = $('#plTitle').value.trim(); if(!title) return;
    const dates = $$('#dateInputs input').map(i => i.value).filter(Boolean);
    const { data: pl, error } = await sb.from('plans').insert({
      created_by: me.id, title, place: $('#plPlace').value.trim() || null, details: $('#plDetails').value.trim() || null
    }).select().single();
    if(error){ toast("Couldn't create the plan."); return; }
    if(dates.length){
      const r = await sb.from('plan_options').insert(dates.map(v => ({ plan_id: pl.id, option_time: new Date(v).toISOString() })));
      if(r.error) toast("The plan was created, but the times didn't save.");
    }
    $('#planForm').reset(); $('#dateInputs').innerHTML = '<input type="datetime-local">'; $('#planForm').hidden = true;
    toast('Plan created'); loadPlans();
  });
};

// ---------- realtime ----------
function subscribe(){
  unsubscribe();
  channel = sb.channel('hub')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, p => addMsg(p.new))
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, p => { msgs = msgs.filter(m => m.id !== p.old.id); renderMsgs(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, onProfile)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'photos' }, () => loadPhotos())
    .on('postgres_changes', { event: '*', schema: 'public', table: 'plans' }, schedulePlans)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'plan_options' }, schedulePlans)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'plan_votes' }, schedulePlans)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'plan_rsvps' }, schedulePlans)
    .subscribe();
}
function unsubscribe(){ if(channel){ sb.removeChannel(channel); channel = null; } }

document.addEventListener('visibilitychange', () => {
  if(document.hidden || !me || $('#app').hidden) return;
  loadMessages(); loadProfiles().then(() => { renderPeople(); renderMarkers(); }); loadPlans();
});

// ---------- start ----------
authTab('login');
(async function boot(){
  try {
    const { data: { session } } = await sb.auth.getSession();
    if(session) await afterLogin(session.user); else show('auth');
  } catch(err){ show('auth'); toast("Couldn't reach the server. Check your connection."); }
})();
</script>
